note: |
  Step 8: the model gets each distinct request text once, on its own and only as data, and answers with a JSON object (asks_for_deletion, request_in_english); the English reading is kept as the reason (EXT-404). Asking every text alone keeps one text from steering the decision on another (EXT-502). An unusable answer is asked again once with a stricter question, because the gateway keeps every answer and an unusable one would otherwise decide every later run. Only the first 4,000 characters of a text are sent. An empty text asks for nothing. The model may answer true only when the text leaves no doubt (EXT-409). When the model gives no usable answer, the request is not audited as a deletion, and its reason says that a person must check it (EXT-409, your decision of step 8; first designed the other way round). Our own request cases: code/evaluation/request_cases.csv.
