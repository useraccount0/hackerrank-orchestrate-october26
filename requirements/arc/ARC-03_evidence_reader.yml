note: |
  Design: one reader per format (sql_snapshots, json_records, log_lines, text_documents) and one set of rules for all of them (record_fields). The text of a PDF comes from pypdf, and the text of a screenshot from the model gateway, which only writes down what it sees. Identifiers are recognized by the shape of their values wherever they appear (emails and hashes lower-cased, REV-001); names only from fields that are called a name. Whether a record exists comes from explicit signals (404, NOT_FOUND, rows=0, result values), and a missing signal wins. Log lines of one trace are joined. Every SQL table and every JSON collection is a complete listing, for each kind of record its store holds in any file (REV-005). SQLite may only load a snapshot (EXT-502). A file that cannot be read is reported and skipped.
