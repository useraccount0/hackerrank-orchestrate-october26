rationale: |
  Revealed in step 5, in the recheck of c01: on Python 3.11 and newer, datetime.fromisoformat accepts forms such as 20260904T100000Z that Python 3.10 rejects. code/pyproject.toml declares Python 3.10 as the minimum, so one file could be read differently depending on who runs the solution. EXT-402 covers repeated runs, not different Python versions. The tests have run only on Python 3.15 so far (ISS-12).
