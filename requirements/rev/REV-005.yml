rationale: |
  Revealed in step 4, when the interfaces were rechecked against the 32 sample answers: 4 cited verification steps prove ABSENT with evidence that never names the record (case_01, case_02, case_04: evidence_54, an SQL snapshot of the customer_profiles tables; case_31: evidence_51, a JSON snapshot bundle). Found with a script that checks whether each cited evidence file contains the step's resource_id.
